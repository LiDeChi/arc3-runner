[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc3math"
version = "0.1.0"
description = "ARC3 symbolic transform DSL, local engine, Bayesian agent, and adversarial generator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["arc3math*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

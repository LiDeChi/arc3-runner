[project]
name = "arc3"
version = "0.1.0"
description = "ARC3 Adversarial Training Platform — 对抗生成训练平台"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "psutil>=5.9",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
all = [
    "arc3[dev,dashboard,test]",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true
# Gradually enable strict checks:
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["arc3_trainer/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

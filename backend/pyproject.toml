[project]
name = "arc3math"
version = "0.1.0"
description = "ARC3-Math symbolic agent training system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["arc3math*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
